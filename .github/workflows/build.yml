name: Build container and document

on:
  push:
    paths:
      - 'src/**'
      - 'container/**'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'container/**'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - id: lower
        name: Lowercase Repository Name
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check if container rebuild is needed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            container:
              - 'container/**'
              - '.github/workflows/**'

      - name: Extract metadata (tags, labels) for Docker
        if: steps.filter.outputs.container == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to the Container registry
        if: steps.filter.outputs.container == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.filter.outputs.container == 'true'
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build
        env:
          IMAGE: ${{ steps.filter.outputs.container == 'true' && fromJSON(steps.meta.outputs.json).tags[0] || format('{0}/{1}:latest', env.REGISTRY, steps.lower.outputs.image_name) }}
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" "$IMAGE" make

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: thesis-pdf
          path: thesis.pdf

      - name: Publish continuous release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: continuous
          name: Continuous build
          draft: false
          prerelease: true
          body: |
            Latest PDF built from commit ${{ github.sha }}.
            Triggering workflow: ${{ github.workflow }} (#${{ github.run_number }})
          artifacts: thesis.pdf
          artifactErrorsFailBuild: true
          allowUpdates: true

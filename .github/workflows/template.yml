on: [push, pull_request]

name: template

jobs:
  test-latex-template:
    runs-on: ubuntu-latest
    name: Test LaTeX Template
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag thesis-template --file container/Dockerfile container
      - name: Build thesis
        run: docker run --rm --volume "$(pwd)":/workspace thesis-template make test
